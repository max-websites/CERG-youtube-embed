<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Latest Videos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     CONFIG — edit these three lines, nothing else is required
     ============================================================ */
  /* (set below in the <script> block, look for "CONFIG") */

  :root{
    --bg: #FAF9F6;
    --card: #FFFFFF;
    --border: #E4E2DC;
    --ink: #1B1B1F;
    --ink-soft: #6B6B76;
    --accent: #2743B0;
    --accent-soft: #EEF1FA;
    --radius: 10px;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'IBM Plex Sans', system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
    padding:28px 24px 48px;
  }

  .wrap{max-width:1100px;margin:0 auto;}

  header{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:8px;
    margin-bottom:20px;
    border-bottom:1px solid var(--border);
    padding-bottom:16px;
  }
  h1{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:28px;
    letter-spacing:-0.01em;
    margin:0;
  }
  .count{
    font-size:13px;
    color:var(--ink-soft);
    font-variant-numeric: tabular-nums;
  }

  .player-shell{
    position:relative;
    width:100%;
    aspect-ratio:16/9;
    background:#0d0d10;
    border-radius:var(--radius);
    overflow:hidden;
    margin-bottom:28px;
    box-shadow:0 1px 2px rgba(0,0,0,0.06);
  }
  .player-shell iframe{
    position:absolute; inset:0; width:100%; height:100%; border:0;
  }
  .now-playing-label{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:12px;
    font-weight:600;
    letter-spacing:0.06em;
    text-transform:uppercase;
    color:var(--accent);
    margin:0 0 10px;
  }
  .now-playing-label .dot{
    width:7px;height:7px;border-radius:50%;
    background:var(--accent);
    animation:pulse 1.8s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{opacity:1;} 50%{opacity:0.35;}
  }

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(240px,1fr));
    gap:16px;
  }

  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:var(--radius);
    overflow:hidden;
    cursor:pointer;
    text-align:left;
    padding:0;
    font-family:inherit;
    color:inherit;
    transition:transform .15s ease, box-shadow .15s ease, border-color .15s ease;
  }
  .card:hover, .card:focus-visible{
    transform:translateY(-2px);
    border-color:var(--accent);
    box-shadow:0 8px 20px rgba(39,67,176,0.12);
    outline:none;
  }
  .card.active{
    border-color:var(--accent);
    background:var(--accent-soft);
  }

  .thumb-wrap{
    position:relative;
    width:100%;
    aspect-ratio:16/9;
    background:#eee;
  }
  .thumb-wrap img{
    width:100%;height:100%;object-fit:cover;display:block;
  }
  .index-badge{
    position:absolute;
    top:8px; left:8px;
    background:rgba(15,15,18,0.75);
    color:#fff;
    font-size:11px;
    font-weight:600;
    letter-spacing:0.04em;
    padding:3px 7px;
    border-radius:5px;
    font-variant-numeric: tabular-nums;
  }
  .play-glyph{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    opacity:0;
    transition:opacity .15s ease;
    background:rgba(15,15,18,0.25);
  }
  .card:hover .play-glyph, .card:focus-visible .play-glyph{opacity:1;}
  .play-glyph svg{width:36px;height:36px;}

  .meta{padding:12px 14px 14px;}
  .title{
    font-size:14px;
    font-weight:500;
    line-height:1.35;
    margin:0 0 6px;
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
    overflow:hidden;
  }
  .date{
    font-size:12px;
    color:var(--ink-soft);
  }

  .status{
    padding:40px 20px;
    text-align:center;
    color:var(--ink-soft);
    font-size:14px;
  }
  .status.error{color:#9B2C2C;}

  @media (prefers-reduced-motion: reduce){
    .card, .play-glyph, .dot{transition:none; animation:none;}
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Latest videos</h1>
      <span class="count" id="count"></span>
    </header>

    <p class="now-playing-label"><span class="dot"></span>Now playing</p>
    <div class="player-shell">
      <iframe id="player"
        src=""
        title="Video player"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        width="560"
        height="315"
        frameborder="0"
        referrerpolicy="strict-origin-when-cross-origin"
        allowfullscreen>
      </iframe>
    </div>

    <div class="grid" id="grid">
      <div class="status" id="status">Loading videos…</div>
    </div>
  </div>

<script>
/* ============================================================
   CONFIG — the only two lines you need to edit
   (API key is no longer here — it lives encrypted server-side)
   ============================================================ */
const PLAYLIST_ID = "UUpZy_t0WYVlm32-NojxVACQ";    // channel ID with UC swapped for UU
const MAX_RESULTS = 12;                            // how many videos to show
/* ============================================================ */

const grid = document.getElementById('grid');
const statusEl = document.getElementById('status');
const player = document.getElementById('player');
const countEl = document.getElementById('count');

function fmtDate(iso){
  const d = new Date(iso);
  return d.toLocaleDateString(undefined, { year:'numeric', month:'short', day:'numeric' });
}

function playVideo(videoId, cardEl){
  player.src = `https://www.youtube-nocookie.com/embed/${videoId}?autoplay=1&rel=0`;
  document.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
  if (cardEl) cardEl.classList.add('active');
  player.closest('.player-shell').scrollIntoView({ behavior:'smooth', block:'start' });
}

async function loadVideos(){
  if (!PLAYLIST_ID || PLAYLIST_ID.startsWith('YOUR_')){
    statusEl.textContent = 'Add your playlist ID in the CONFIG block at the top of the script.';
    statusEl.classList.add('error');
    return;
  }

  // Fetch from our own proxy — the API key is injected server-side.
  const url = `/api/videos?playlist_id=${PLAYLIST_ID}&max_results=${MAX_RESULTS}`;

  try{
    const res = await fetch(url);
    const data = await res.json();

    if (!res.ok || data.error){
      statusEl.textContent = data.error?.message || data.error || 'Could not load videos. Check your playlist ID.';
      statusEl.classList.add('error');
      return;
    }

    const items = (data.items || []).filter(i => i.snippet?.resourceId?.videoId);
    if (items.length === 0){
      statusEl.textContent = 'No videos found for this playlist.';
      return;
    }

    grid.innerHTML = '';
    countEl.textContent = `${items.length} video${items.length === 1 ? '' : 's'}`;

    items.forEach((item, i) => {
      const s = item.snippet;
      const videoId = s.resourceId.videoId;
      const thumb = s.thumbnails?.medium?.url || s.thumbnails?.default?.url;

      const card = document.createElement('button');
      card.className = 'card';
      card.setAttribute('aria-label', `Play ${s.title}`);
      card.innerHTML = `
        <div class="thumb-wrap">
          <img src="${thumb}" alt="" loading="lazy">
          <span class="index-badge">${String(i+1).padStart(2,'0')}</span>
          <span class="play-glyph">
            <svg viewBox="0 0 24 24" fill="white"><path d="M8 5v14l11-7z"/></svg>
          </span>
        </div>
        <div class="meta">
          <p class="title">${s.title}</p>
          <p class="date">${fmtDate(s.publishedAt)}</p>
        </div>
      `;
      card.addEventListener('click', () => playVideo(videoId, card));
      grid.appendChild(card);

      if (i === 0) playVideo(videoId, card); // load latest video by default
    });

  } catch(err){
    statusEl.textContent = 'Something went wrong loading the video list.';
    statusEl.classList.add('error');
  }
}

loadVideos();
</script>
</body>
</html>
