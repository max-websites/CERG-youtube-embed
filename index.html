<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Latest Videos</title>
<link rel="stylesheet" href="css/main.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@82,720&display=swap">
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Latest videos</h1>
      <span class="count" id="count"></span>
    </header>

    <p class="now-playing-label"><span class="dot"></span>Now playing</p>
    <div class="player-shell">
      <iframe id="player"
        src=""
        title="Video player"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        width="560"
        height="315"
        frameborder="0"
        referrerpolicy="strict-origin-when-cross-origin"
        allowfullscreen>
      </iframe>
    </div>

    <div class="grid" id="grid">
      <div class="status" id="status">Loading videos…</div>
    </div>
  </div>
  <script type="module" src="js/index.js"></script>
</body>
</html>
